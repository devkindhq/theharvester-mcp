name: Release

on:
  push:
    tags: ["v*"] # Triggers on version tags like v1.0.1

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check tag matches server.json version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          JSON_VERSION="$(jq -r '.version' server.json)"
          PKG_VERSION="$(jq -r '.packages[0].identifier' server.json | sed 's/.*://')"
          if [ "$TAG_VERSION" != "$JSON_VERSION" ] || [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION, server.json version $JSON_VERSION, package tag $PKG_VERSION must all match" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            devkind/theharvester-mcp:${{ steps.version.outputs.version }}
            devkind/theharvester-mcp:latest

  publish:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check tag matches server.json version
        run: |
          [ "${GITHUB_REF_NAME#v}" = "$(jq -r '.version' server.json)" ]

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # [unverified] The registry docs say GitHub-based auth allows names of the form
      # io.github.username/* or io.github.orgname/*, but do not state that github-oidc
      # specifically grants the org namespace io.github.devkindhq/*. Confirm on the first tag.
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
